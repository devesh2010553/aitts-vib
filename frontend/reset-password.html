<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reset Password - AITTS</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root{--gold:#b8860b;--gold-light:#d4a017;--gold-pale:#fdf6e3;--gold-border:rgba(184,134,11,0.25);--gold-glow:rgba(184,134,11,0.12);--bg:#fafaf8;--bg-card:#ffffff;--bg-elevated:#f0ebe0;--border:#e5dfd0;--text:#1a1a1a;--text-sec:#555550;--text-muted:#888880;--red:#c53030;--red-light:rgba(197,48,48,0.1);--green:#276749;--green-light:rgba(39,103,73,0.1);--radius:12px;--radius-sm:8px;--shadow-md:0 4px 24px rgba(0,0,0,0.12);--font:"DM Sans",sans-serif;--font-display:"Playfair Display",serif}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--gold:#d4a017;--gold-light:#e8bc2e;--gold-pale:#2a2410;--gold-border:rgba(212,160,23,0.3);--gold-glow:rgba(212,160,23,0.18);--bg:#121210;--bg-card:#1c1c18;--bg-elevated:#242420;--border:#34342c;--text:#f2f0e6;--text-sec:#cbc8ba;--text-muted:#94917f;--red:#f28b82;--red-light:rgba(242,139,130,0.15);--green:#7fd99a;--green-light:rgba(127,217,154,0.15);--shadow-md:0 4px 24px rgba(0,0,0,0.55)}}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;padding-top:calc(20px + env(safe-area-inset-top,0px));padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
.card{background:var(--bg-card);border:1.5px solid var(--border);border-radius:var(--radius);padding:32px 28px;max-width:400px;width:100%;box-shadow:var(--shadow-md)}
.logo{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,var(--gold-light),var(--gold));display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--font-display);font-weight:900;font-size:20px;margin:0 auto 16px}
h1{font-family:var(--font-display);font-size:21px;text-align:center;margin-bottom:6px}
.sub{text-align:center;color:var(--text-sec);font-size:13px;margin-bottom:22px}
.fg{margin-bottom:14px}
.fg label{display:block;font-size:12px;color:var(--text-sec);margin-bottom:5px;font-weight:500}
input{width:100%;padding:11px 14px;border-radius:var(--radius-sm);border:1.5px solid var(--border);background:var(--bg-elevated);color:var(--text);font-family:var(--font);font-size:14px;outline:none;transition:0.2s}
input:focus{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-glow)}
.btn{width:100%;padding:12px;border-radius:var(--radius-sm);border:none;background:linear-gradient(135deg,var(--gold-light),var(--gold));color:#fff;font-family:var(--font);font-size:14px;font-weight:700;cursor:pointer;margin-top:6px;transition:0.2s}
.btn:disabled{opacity:0.6;cursor:not-allowed}
.btn:hover:not(:disabled){filter:brightness(1.05)}
.msg{font-size:13px;padding:10px 12px;border-radius:var(--radius-sm);margin-bottom:16px;display:flex;gap:8px;align-items:flex-start}
.msg.err{background:var(--red-light);color:var(--red)}
.msg.ok{background:var(--green-light);color:var(--green)}
.hidden{display:none !important}
.center-link{display:block;text-align:center;margin-top:18px;font-size:13px;color:var(--gold);text-decoration:none}
.spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,0.4);border-top-color:#fff;border-radius:50%;animation:spin 0.7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.email-chip{background:var(--gold-pale);border:1px solid var(--gold-border);color:var(--gold);font-size:12px;padding:6px 10px;border-radius:6px;text-align:center;margin-bottom:16px;word-break:break-all}
</style>
</head>
<body>
<div class="card">
  <div class="logo">A</div>
  <h1 id="page-title">Reset your password</h1>
  <p class="sub" id="page-sub">Choose a new password for your AITTS account</p>

  <div id="msg-area"></div>

  <div id="email-chip" class="email-chip hidden"></div>

  <form id="reset-form" class="hidden" onsubmit="return false">
    <div class="fg">
      <label>New Password</label>
      <input type="password" id="new-pass" placeholder="At least 6 characters" autocomplete="new-password">
    </div>
    <div class="fg">
      <label>Confirm New Password</label>
      <input type="password" id="confirm-pass" placeholder="Re-enter password" autocomplete="new-password" onkeydown="if(event.key==='Enter')doReset()">
    </div>
    <button class="btn" id="submit-btn" onclick="doReset()"><span id="submit-label">Reset Password</span></button>
  </form>

  <a class="center-link" href="/">Back to AITTS</a>
</div>

<!-- Firebase config injected server-side (see server.js renderWithFirebaseConfig) -->
<script type="module">/* FIREBASE_CONFIG_PLACEHOLDER */</script>

<script>
function showMsg(text, type){
  var area = document.getElementById('msg-area');
  area.innerHTML = '<div class="msg '+type+'"><i class="fas fa-'+(type==='ok'?'check-circle':'exclamation-circle')+'" style="margin-top:1px"></i><span>'+text+'</span></div>';
}
function clearMsg(){ document.getElementById('msg-area').innerHTML=''; }

function getParam(name){
  return new URLSearchParams(window.location.search).get(name);
}

var oobCode = getParam('oobCode');
var mode = getParam('mode');

function init(){
  if(!window._firebaseAuth){
    // Firebase init script runs inline above and should be synchronous by
    // the time this runs, but guard anyway in case of a load-order issue.
    showMsg('Could not initialize. Please refresh the page.', 'err');
    return;
  }
  if(mode !== 'resetPassword' || !oobCode){
    document.getElementById('page-title').textContent = 'Invalid link';
    document.getElementById('page-sub').textContent = 'This password reset link is missing required information.';
    showMsg('This link looks incomplete or malformed. Please request a new password reset email.', 'err');
    return;
  }
  window._firebaseAuth.verifyPasswordResetCode(oobCode).then(function(email){
    var chip = document.getElementById('email-chip');
    chip.textContent = email;
    chip.classList.remove('hidden');
    document.getElementById('reset-form').classList.remove('hidden');
  }).catch(function(err){
    document.getElementById('page-title').textContent = 'Link expired or invalid';
    document.getElementById('page-sub').textContent = 'This password reset link can no longer be used.';
    if(err && err.code === 'auth/expired-action-code'){
      showMsg('This reset link has expired. Please request a new one from the login page.', 'err');
    } else if(err && err.code === 'auth/invalid-action-code'){
      showMsg('This reset link has already been used or is invalid. Please request a new one.', 'err');
    } else {
      showMsg('Something went wrong verifying this link. Please request a new reset email.', 'err');
    }
  });
}

function doReset(){
  clearMsg();
  var p1 = document.getElementById('new-pass').value;
  var p2 = document.getElementById('confirm-pass').value;
  if(!p1 || p1.length < 6){ showMsg('Password must be at least 6 characters.', 'err'); return; }
  if(p1 !== p2){ showMsg('Passwords do not match.', 'err'); return; }

  var btn = document.getElementById('submit-btn');
  var label = document.getElementById('submit-label');
  btn.disabled = true;
  label.innerHTML = '<span class="spin"></span> Resetting...';

  window._firebaseAuth.confirmPasswordReset(oobCode, p1).then(function(){
    document.getElementById('reset-form').classList.add('hidden');
    document.getElementById('email-chip').classList.add('hidden');
    document.getElementById('page-title').textContent = 'Password reset';
    document.getElementById('page-sub').textContent = 'Your password has been changed successfully.';
    showMsg('You can now log in with your new password.', 'ok');
  }).catch(function(err){
    btn.disabled = false;
    label.textContent = 'Reset Password';
    if(err && err.code === 'auth/weak-password'){
      showMsg('Please choose a stronger password.', 'err');
    } else if(err && err.code === 'auth/expired-action-code'){
      showMsg('This link has expired. Please request a new reset email.', 'err');
    } else {
      showMsg('Could not reset password. Please try again or request a new link.', 'err');
    }
  });
}

// The inline Firebase-init <script> above runs synchronously before this
// block, so window._firebaseAuth is already set by the time we get here.
init();
</script>
</body>
</html>
